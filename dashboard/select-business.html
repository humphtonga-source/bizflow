<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Business - BizFlow</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body class="dashboard-page">
    <nav class="dashboard-nav">
        <div class="container">
            <div class="nav-brand">BizFlow</div>
            <div class="nav-user">
                <span id="userEmail"></span>
                <button id="logoutBtn" class="btn btn-outline btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <main class="dashboard-main">
        <div class="container">
            <section class="dashboard-section">
                <div class="section-header">
                    <h1>Select Your Business Type</h1>
                    <p>Choose the category that best describes your business</p>
                </div>

                <div id="businessGrid" class="business-grid"></div>

                <div id="messageContainer" class="message"></div>
                <div id="loadingSpinner" class="loading-spinner hidden">
                    <div class="spinner"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="../assets/js/supabase-client.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/dashboard.js"></script>
</body>
</html>
