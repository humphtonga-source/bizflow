<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BizFlow — Choose Your Business</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12151c;
      --bg2: #1a1f2e;
      --border: #2a3050;
      --gold: #f0a500;
      --text: #e8eaf0;
      --txt3: #6b7499;
      --green: #22c55e;
      --red: #ef4444;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, #1a1f2e 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 1200px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 60px;
    }
    
    .logo {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    
    .logo span { color: var(--gold); }
    
    .header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    
    .header p {
      color: var(--txt3);
      font-size: 16px;
      margin-bottom: 30px;
    }
    
    .businesses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .business-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    
    .business-card:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(240, 165, 0, 0.1);
    }
    
    .business-icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    
    .business-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    
    .business-desc {
      font-size: 13px;
      color: var(--txt3);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    
    .business-btn {
      width: 100%;
      padding: 10px 16px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    
    .business-btn:hover {
      background: #e09500;
      transform: scale(1.02);
    }
    
    .business-btn:disabled {
      background: var(--txt3);
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    .user-section {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      text-align: center;
    }
    
    .user-info {
      margin-bottom: 12px;
    }
    
    .user-email {
      font-size: 14px;
      color: var(--gold);
      font-weight: 600;
    }
    
    .user-status {
      font-size: 12px;
      color: var(--txt3);
    }
    
    .signout-btn {
      padding: 8px 16px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    
    .signout-btn:hover {
      background: #dc2626;
    }
    
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--txt3);
    }
    
    .spinner {
      border: 3px solid var(--border);
      border-top: 3px solid var(--gold);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 16px;
      color: var(--red);
      margin-bottom: 20px;
      text-align: center;
    }
    
    @media (max-width: 640px) {
      .header h1 { font-size: 24px; }
      .header p { font-size: 14px; }
      .businesses-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <div class="logo">Biz <span>Flow</span></div>
    <h1>Choose Your Business</h1>
    <p>Select the type of business you want to manage</p>
  </div>
  
  <!-- USER SECTION -->
  <div class="user-section" id="userSection" style="display:none;">
    <div class="user-info">
      <div class="user-email" id="userEmail"></div>
      <div class="user-status">Signed in to BizFlow</div>
    </div>
    <button class="signout-btn" onclick="signOut()">Sign Out</button>
  </div>
  
  <!-- ERROR MESSAGE -->
  <div class="error" id="errorMessage" style="display:none;"></div>
  
  <!-- LOADING STATE -->
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <p>Loading businesses...</p>
  </div>
  
  <!-- BUSINESSES GRID -->
  <div class="businesses-grid" id="businessesGrid" style="display:none;"></div>
</div>

<!-- SUPABASE -->
<script async defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Initialize Supabase
  const SUPABASE_URL = 'https://piaphpiowvgalvduacpt.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYXBocGlvd3ZnYWx2ZHVhY3B0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTg4MDUsImV4cCI6MjA5NjI3NDgwNX0.lEOrhLB0AaCzsDXWzXHkvth83-KtXKOpTYe8ndi3bFc';
  const { createClient } = window.supabase;
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  
  // Business types
  const BUSINESSES = [
    { id: 'salon', name: 'Salon', icon: '💅', desc: 'Hair & beauty management' },
    { id: 'restaurant', name: 'Restaurant', icon: '🍽️', desc: 'Food service operations' },
    { id: 'bookshop', name: 'Bookshop', icon: '📚', desc: 'Retail management' },
    { id: 'chemist', name: 'Chemist', icon: '💊', desc: 'Pharmacy operations' },
    { id: 'law-firm', name: 'Law Firm', icon: '⚖️', desc: 'Legal practice management' },
    { id: 'betting', name: 'Betting Shop', icon: '🎰', desc: 'Betting operations' }
  ];
  
  async function initPage() {
    try {
      // Check if user is logged in
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) {
        // Redirect to auth if not logged in
        window.location.href = '/bizflow/auth.html';
        return;
      }
      
      // Show user info
      document.getElementById('userEmail').textContent = session.user.email;
      document.getElementById('userSection').style.display = 'block';
      
      // Load user's businesses
      const { data: businesses, error } = await supabase
        .from('businesses')
        .select('*')
        .eq('owner_id', session.user.id);
      
      if (error) throw error;
      
      // Render business cards
      renderBusinessCards(businesses || []);
      
      // Hide loading
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('businessesGrid').style.display = 'grid';
      
    } catch (err) {
      console.error('Init error:', err);
      showError(err.message);
    }
  }
  
  function renderBusinessCards(userBusinesses) {
    const grid = document.getElementById('businessesGrid');
    
    const html = BUSINESSES.map(business => {
      // Check if user already has this business type
      const existingBusiness = userBusinesses.find(b => b.profession === business.id);
      
      if (existingBusiness) {
        // User has this business - show "Open" button
        return `
          <div class="business-card">
            <div class="business-icon">${business.icon}</div>
            <div class="business-name">${business.name}</div>
            <div class="business-desc">${business.desc}</div>
            <button class="business-btn" onclick="openBusiness('${business.id}', '${existingBusiness.id}')">
              Open
            </button>
          </div>
        `;
      } else {
        // User doesn't have this business - show "Create" button
        return `
          <div class="business-card">
            <div class="business-icon">${business.icon}</div>
            <div class="business-name">${business.name}</div>
            <div class="business-desc">${business.desc}</div>
            <button class="business-btn" onclick="createBusiness('${business.id}')">
              Create
            </button>
          </div>
        `;
      }
    }).join('');
    
    grid.innerHTML = html;
  }
  
  async function createBusiness(profession) {
    try {
      const { data: { session } } = await supabase.auth.getSession();
      
      // Create new business
      const { data: business, error } = await supabase
        .from('businesses')
        .insert([{
          owner_id: session.user.id,
          profession: profession,
          name: `My ${profession.charAt(0).toUpperCase() + profession.slice(1)}`
        }])
        .select()
        .single();
      
      if (error) throw error;
      
      // Redirect to app
      window.location.href = `/bizflow/app.html?prof=${profession}&bid=${business.id}`;
      
    } catch (err) {
      alert('Error creating business: ' + err.message);
    }
  }
  
  function openBusiness(profession, businessId) {
    window.location.href = `/bizflow/app.html?prof=${profession}&bid=${businessId}`;
  }
  
  async function signOut() {
    try {
      await supabase.auth.signOut();
      window.location.href = '/bizflow/auth.html';
    } catch (err) {
      alert('Error signing out: ' + err.message);
    }
  }
  
  function showError(message) {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
    document.getElementById('loadingState').style.display = 'none';
  }
  
  // Initialize on load
  window.addEventListener('load', initPage);
</script>

</body>
</html>
