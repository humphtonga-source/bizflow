<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BizFlow — Choose Your Business</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12151c;
      --bg2: #1a1f2e;
      --border: #2a3050;
      --gold: #f0a500;
      --text: #e8eaf0;
      --txt3: #6b7499;
      --red: #ef4444;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, #1a1f2e 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 20px 20px;
    }
    
    .container {
      width: 100%;
      max-width: 1200px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 60px;
    }
    
    .logo {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    
    .logo span { color: var(--gold); }
    
    .header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    
    .header p {
      color: var(--txt3);
      font-size: 16px;
      margin-bottom: 30px;
    }
    
    .businesses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .business-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    
    .business-card:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(240, 165, 0, 0.1);
    }
    
    .business-icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    
    .business-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    
    .business-desc {
      font-size: 13px;
      color: var(--txt3);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    
    .business-btn {
      width: 100%;
      padding: 10px 16px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    
    .business-btn:hover {
      background: #e09500;
      transform: scale(1.02);
    }
    
    .business-btn:disabled {
      background: var(--txt3);
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(18, 21, 28, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .user-email {
      font-size: 13px;
      color: var(--gold);
      font-weight: 600;
    }

    .user-status {
      font-size: 11px;
      color: var(--txt3);
    }

    .user-info {
      text-align: right;
    }

    .signout-btn {
      padding: 8px 16px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }

    .signout-btn:hover {
      background: #dc2626;
    }
    
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--txt3);
    }
    
    .spinner {
      border: 3px solid var(--border);
      border-top: 3px solid var(--gold);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 16px;
      color: var(--red);
      margin-bottom: 20px;
      text-align: center;
    }
    
    @media (max-width: 640px) {
      .header h1 { font-size: 24px; }
      .header p { font-size: 14px; }
      .businesses-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="top-bar" id="userSection" style="display:none;">
  <div class="user-info">
    <div class="user-email" id="userEmail"></div>
    <div class="user-status">Signed in to BizFlow</div>
  </div>
  <button class="signout-btn" onclick="window.signOut()">Sign Out</button>
</div>

<div class="container">
  <div class="header">
    <div class="logo">Biz <span>Flow</span></div>
    <h1>Choose Your Business</h1>
    <p>Select the type of business you want to manage</p>
  </div>
  
  <div class="error" id="errorMessage" style="display:none;"></div>
  
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <p>Loading businesses...</p>
  </div>
  
  <div class="businesses-grid" id="businessesGrid" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Supabase config
  const SUPABASE_URL = 'https://piaphpiowvgalvduacpt.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYXBocGlvd3ZnYWx2ZHVhY3B0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTg4MDUsImV4cCI6MjA5NjI3NDgwNX0.lEOrhLB0AaCzsDXWzXHkvth83-KtXKOpTYe8ndi3bFc';
  
  let supabaseClient = null;
  
  // Wait for window.supabase to be available
  async function initializeSupabase() {
    return new Promise((resolve) => {
      const checkInterval = setInterval(() => {
        if (window.supabase && window.supabase.createClient) {
          clearInterval(checkInterval);
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          resolve();
        }
      }, 50);
    });
  }
  
  // Business types
  const BUSINESSES = [
    { id: 'salon', name: 'Salon', icon: '💅', desc: 'Hair & beauty management' },
    { id: 'restaurant', name: 'Restaurant', icon: '🍽️', desc: 'Food service operations' },
    { id: 'bookshop', name: 'Bookshop', icon: '📚', desc: 'Retail management' },
    { id: 'chemist', name: 'Chemist', icon: '💊', desc: 'Pharmacy operations' },
    { id: 'law-firm', name: 'Law Firm', icon: '⚖️', desc: 'Legal practice management' },
    { id: 'betting', name: 'Betting Shop', icon: '🎰', desc: 'Betting operations' }
  ];
  
  async function initPage() {
    try {
      // Initialize Supabase first
      await initializeSupabase();
      
      if (!supabaseClient) {
        throw new Error('Failed to initialize Supabase');
      }
      
      // Check if user is logged in
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session) {
        window.location.href = '/bizflow/auth.html';
        return;
      }
      
      // Show user info
      document.getElementById('userEmail').textContent = session.user.email;
      document.getElementById('userSection').style.display = 'block';
      
      // Load user's businesses
      const { data: businesses, error } = await supabaseClient
        .from('businesses')
        .select('*')
        .eq('owner_id', session.user.id);
      
      if (error) throw error;
      
      // Render business cards
      renderBusinessCards(businesses || []);
      
      // Hide loading
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('businessesGrid').style.display = 'grid';
      
    } catch (err) {
      console.error('Init error:', err);
      document.getElementById('errorMessage').textContent = err.message;
      document.getElementById('errorMessage').style.display = 'block';
      document.getElementById('loadingState').style.display = 'none';
    }
  }
  
  function renderBusinessCards(userBusinesses) {
    const grid = document.getElementById('businessesGrid');
    
    const html = BUSINESSES.map(business => {
      const existingBusiness = userBusinesses.find(b => b.profession === business.id);
      
      if (existingBusiness) {
        return `
          <div class="business-card">
            <div class="business-icon">${business.icon}</div>
            <div class="business-name">${business.name}</div>
            <div class="business-desc">${business.desc}</div>
            <button class="business-btn" onclick="window.openBusiness('${business.id}', '${existingBusiness.id}')">Open</button>
          </div>
        `;
      } else {
        return `
          <div class="business-card">
            <div class="business-icon">${business.icon}</div>
            <div class="business-name">${business.name}</div>
            <div class="business-desc">${business.desc}</div>
            <button class="business-btn" onclick="window.createBusiness('${business.id}')">Create</button>
          </div>
        `;
      }
    }).join('');
    
    grid.innerHTML = html;
  }
  
  window.createBusiness = async function(profession) {
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      const { data: business, error } = await supabaseClient
        .from('businesses')
        .insert([{
          owner_id: session.user.id,
          profession: profession,
          name: `My ${profession.charAt(0).toUpperCase() + profession.slice(1)}`
        }])
        .select()
        .single();
      
      if (error) throw error;
      
      window.location.href = `/bizflow/app.html?prof=${profession}&bid=${business.id}`;
      
    } catch (err) {
      alert('Error creating business: ' + err.message);
    }
  };
  
  window.openBusiness = function(profession, businessId) {
    window.location.href = `/bizflow/app.html?prof=${profession}&bid=${businessId}`;
  };
  
  window.signOut = async function() {
    try {
      await supabaseClient.auth.signOut();
      window.location.href = '/bizflow/auth.html';
    } catch (err) {
      alert('Error signing out: ' + err.message);
    }
  };
  
  // Initialize on window load
  window.addEventListener('load', initPage);
</script>

</body>
</html>
