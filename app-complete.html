<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>BizFlow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --black:  #0A0A0A;
  --black2: #111111;
  --black3: #1A1A1A;
  --gold:   #C9A84C;
  --gold2:  #E8C56A;
  --goldl:  rgba(201,168,76,0.1);
  --white:  #FAFAFA;
  --muted:  #888888;
  --green:  #22C55E;
  --greenl: rgba(34,197,94,0.1);
  --red:    #EF4444;
  --redl:   rgba(239,68,68,0.1);
  --blue:   #3B82F6;
  --bluel:  rgba(59,130,246,0.1);
  --border: rgba(201,168,76,0.15);
  --radius: 14px;
  --sw: 240px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }

/* LOADING */
#loading { position: fixed; inset: 0; background: var(--black); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; gap: 16px; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(201,168,76,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* TOAST */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--black2); border: 1px solid var(--border); color: var(--white); padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 9999; opacity: 0; transform: translateY(10px); transition: all 0.3s; pointer-events: none; max-width: 300px; }
.toast.show { opacity: 1; transform: translateY(0); }

/* SIDEBAR */
.sidebar { width: var(--sw); background: var(--black2); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; left: 0; top: 0; height: 100vh; overflow-y: auto; z-index: 100; transition: transform 0.3s; scrollbar-width: thin; }
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.sidebar.hidden { transform: translateX(-100%); }

.sb-head { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.sb-logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; }
.sb-logo span { color: var(--gold); }
.sb-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; display: none; }
@media(max-width:768px) { .sb-close { display: block; } }

.sb-profile { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.sb-av { width: 42px; height: 42px; background: var(--goldl); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: var(--gold); flex-shrink: 0; }
.sb-pname { font-size: 14px; font-weight: 700; }
.sb-prole { font-size: 11px; color: var(--gold); margin-top: 2px; }
.sb-biz { font-size: 11px; color: var(--muted); margin-top: 1px; }

nav .sec-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 12px 20px 6px; font-weight: 600; }
.nav-btn { width: 100%; padding: 11px 20px; background: none; border: none; border-left: 3px solid transparent; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s; text-align: left; }
.nav-btn:hover { color: var(--gold); background: rgba(201,168,76,0.05); }
.nav-btn.active { color: var(--gold); background: rgba(201,168,76,0.08); border-left-color: var(--gold); }

.sb-spacer { flex: 1; }
.sb-foot { padding: 14px 20px; border-top: 1px solid var(--border); }
.btn-logout { width: 100%; background: none; border: 1px solid var(--border); color: var(--muted); padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
.btn-logout:hover { border-color: var(--red); color: var(--red); }

/* MOBILE HEADER */
.mob-head { display: none; position: fixed; top: 0; left: 0; right: 0; height: 56px; background: var(--black2); border-bottom: 1px solid var(--border); align-items: center; justify-content: space-between; padding: 0 16px; z-index: 80; }
.mob-menu { background: none; border: none; color: var(--white); font-size: 22px; cursor: pointer; padding: 6px; }
@media(max-width:768px) { .mob-head { display: flex; } }

/* MAIN CONTENT */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; margin-left: var(--sw); }
@media(max-width:768px) { .main { margin-left: 0; padding-top: 56px; } }

.content { flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; margin: 0 auto; width: 100%; }
@media(max-width:640px) { .content { padding: 16px; } }

/* SIDEBAR OVERLAY */
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 99; }
.sidebar-overlay.show { display: block; }

/* MODAL */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
.modal.show { display: flex; }
.modal-box { background: var(--black2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
.modal-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; margin-bottom: 16px; }
.modal-content { margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; }
.btn { padding: 10px 16px; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-gold { background: var(--gold); color: var(--black); flex: 1; }
.btn-gold:hover { background: var(--gold2); }
.btn-cancel { background: var(--black3); border: 1px solid var(--border); color: var(--muted); flex: 1; }
.btn-cancel:hover { border-color: var(--gold); color: var(--gold); }

/* SHARED STYLES */
.input { width: 100%; background: var(--black3); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 11px 14px; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border 0.2s; margin-bottom: 10px; }
.input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.1); }

/* SECTIONS */
.section { display: none; }
.section.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
/* ═══════════════════════════════════════════════════════════
   ADD THESE STYLES TO app.html <style> SECTION
   ═══════════════════════════════════════════════════════════ */

/* PAGE HEADERS */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 28px;
  gap: 20px;
}

.page-header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 4px;
}

.page-sub {
  font-size: 13px;
  color: var(--muted);
}

/* STAT CARDS */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--black2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--gold), transparent);
}

.stat-icon {
  font-size: 28px;
  margin-bottom: 8px;
}

.stat-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 4px;
}

.stat-sub {
  font-size: 12px;
  color: var(--muted);
}

/* CARDS & CONTAINERS */
.card {
  background: var(--black2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-content {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

/* TWO COLUMN LAYOUT */
.two-col {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}

/* FORMS */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media(max-width:640px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
}

/* APPOINTMENTS */
.appt-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--black3);
  border-radius: 8px;
  margin-bottom: 8px;
}

.appt-time {
  font-weight: 700;
  color: var(--gold);
  min-width: 50px;
}

.appt-details {
  flex: 1;
}

.appt-name {
  font-size: 14px;
  font-weight: 600;
}

.appt-phone {
  font-size: 12px;
  color: var(--muted);
}

.appt-status {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  text-transform: capitalize;
}

.appt-status.pending {
  background: var(--goldl);
  color: var(--gold);
}

.appt-status.done {
  background: var(--greenl);
  color: var(--green);
}

.appt-status.cancelled {
  background: var(--redl);
  color: var(--red);
}

.appt-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  background: var(--black3);
  border-left: 3px solid var(--gold);
  border-radius: 8px;
  margin-bottom: 12px;
}

.appt-card-left {
  flex: 1;
}

.appt-card-name {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}

.appt-card-details {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.appt-card-right {
  text-align: right;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* FINANCE */
.finance-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.finance-item:last-child {
  border-bottom: none;
}

.finance-icon {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 18px;
}

.finance-icon.income {
  background: var(--greenl);
}

.finance-icon.expense {
  background: var(--redl);
}

.finance-title {
  font-size: 14px;
  font-weight: 600;
}

.finance-desc {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.finance-amount {
  font-size: 15px;
  font-weight: 700;
}

.finance-amount.income {
  color: var(--green);
}

.finance-amount.expense {
  color: var(--red);
}

/* ACTIVITY */
.activity-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.activity-item:last-child {
  border-bottom: none;
}

.activity-icon {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--goldl);
  border-radius: 50%;
  font-size: 16px;
}

.activity-title {
  font-size: 14px;
  font-weight: 600;
}

.activity-time {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

/* BADGES */
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  text-transform: capitalize;
}

.badge.pending {
  background: var(--goldl);
  color: var(--gold);
}

.badge.done {
  background: var(--greenl);
  color: var(--green);
}

.badge.cancelled {
  background: var(--redl);
  color: var(--red);
}

/* FILTERS */
.filters {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

.filters .input {
  flex: 1;
  margin-bottom: 0;
  max-width: none;
}

/* BUTTONS */
.btn-sm {
  padding: 6px 12px;
  background: var(--black3);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-sm:hover {
  border-color: var(--gold);
  color: var(--gold);
}

.btn-small {
  padding: 4px 8px;
  background: var(--gold);
  color: var(--black);
  border: none;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-small:hover {
  background: var(--gold2);
}

/* EMPTY STATE */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 13px;
}

/* RESPONSIVE */
@media(max-width:768px) {
  .page-header {
    flex-direction: column;
  }
  
  .appt-card {
    flex-direction: column;
    align-items: flex-start;
  }
  
  .appt-card-right {
    width: 100%;
    margin-top: 12px;
    flex-direction: row;
  }
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- APP WRAPPER -->
<div class="app-wrap" style="display:none;" id="app-wrap">
  
  <!-- SIDEBAR OVERLAY (Mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">Biz<span>Flow</span></div>
      <button class="sb-close" onclick="toggleSidebar()">✕</button>
    </div>
    
    <div class="sb-profile">
      <div class="sb-av" id="sb-avatar">-</div>
      <div>
        <div class="sb-pname" id="sb-user">User</div>
        <div class="sb-prole" id="sb-profession">Salon</div>
        <div class="sb-biz" id="sb-bizname">Business</div>
      </div>
    </div>
    
    <nav id="nav-menu" style="flex:1;"></nav>
    
    <div class="sb-foot">
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>
  </div>
  
  <!-- MOBILE HEADER -->
  <div class="mob-head" id="mobile-header">
    <button class="mob-menu" onclick="toggleSidebar()">☰</button>
    <div style="font-size:16px;font-weight:600;" id="mob-title">Dashboard</div>
    <div style="width:32px;"></div>
  </div>
  
  <!-- MAIN CONTENT -->
  <div class="main">
    <div class="content" id="content">
      <!-- Profession module will load here -->
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Title</div>
    <div class="modal-content" id="modal-content"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" id="modal-btn" onclick="handleModalAction()">Confirm</button>
    </div>
  </div>
</div>

<!-- MODULE SCRIPTS (will be loaded dynamically) -->
<script id="module-script"></script>

<script>
// ═══════════════════════════════════════════════════════════
// GLOBAL STATE
// ═══════════════════════════════════════════════════════════
let STATE = {
  profession: null,
  businessId: null,
  userId: null,
  user: null,
  business: null,
  supabase: null
};

// ═══════════════════════════════════════════════════════════
// SUPABASE INIT
// ═══════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://piaphpiowvgalvduacpt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYXBocGlvd3ZnYWx2ZHVhY3B0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTg4MDUsImV4cCI6MjA5NjI3NDgwNX0.lEOrhLB0AaCzsDXWzXHkvth83-KtXKOpTYe8ndi3bFc';
STATE.supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ═══════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════
function showToast(msg, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.backgroundColor = type === 'error' ? 'rgba(239,68,68,0.1)' : 'var(--black2)';
  toast.style.color = type === 'error' ? '#EF4444' : 'var(--white)';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  sidebar.classList.toggle('hidden');
  overlay.classList.toggle('show');
}

function showModal(title, content, btnText = 'Confirm', callback = null) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = content;
  document.getElementById('modal-btn').textContent = btnText;
  document.getElementById('modal-btn').onclick = callback || (() => closeModal());
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function hideLoading() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app-wrap').style.display = 'flex';
}

// ═══════════════════════════════════════════════════════════
// NAV MENU BUILDER
// ═══════════════════════════════════════════════════════════
function buildNavMenu(modules) {
  const nav = document.getElementById('nav-menu');
  nav.innerHTML = '';
  
  modules.forEach((mod, idx) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (idx === 0 ? ' active' : '');
    btn.innerHTML = `<span style="font-size:18px;">${mod.icon}</span><span>${mod.label}</span>`;
    btn.onclick = () => switchSection(mod.id, btn);
    nav.appendChild(btn);
  });
}

function switchSection(sectionId, btnElement) {
  // Hide all sections
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  
  // Deactivate all nav buttons
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  // Show selected section
  const section = document.getElementById('sec-' + sectionId);
  if (section) {
    section.classList.add('active');
    btnElement.classList.add('active');
    document.getElementById('mob-title').textContent = btnElement.textContent.trim();
  }
}

// ═══════════════════════════════════════════════════════════
// MODULE LOADER
// ═══════════════════════════════════════════════════════════
async function loadModule(profession) {
  try {
    // Dynamically load the profession module
    const script = document.getElementById('module-script');
    const response = await fetch(`modules/${profession}/index.js`);
    const code = await response.text();
    script.textContent = code;
    
    // Module should define: MODULE_INIT() function
    if (typeof MODULE_INIT === 'function') {
      MODULE_INIT();
    }
  } catch (err) {
    console.error('Failed to load module:', err);
    showToast('Failed to load profession module', 'error');
  }
}

// ═══════════════════════════════════════════════════════════
// AUTH & INIT
// ═══════════════════════════════════════════════════════════
async function handleLogout() {
  if (!confirm('Are you sure you want to logout?')) return;
  
  await STATE.supabase.auth.signOut();
  window.location.href = 'index.html';
}

async function initApp() {
  try {
    // Get URL params
    const params = new URLSearchParams(window.location.search);
    STATE.profession = params.get('prof');
    STATE.businessId = params.get('bid');
    
    if (!STATE.profession || !STATE.businessId) {
      window.location.href = 'index.html';
      return;
    }
    
    // Get current user
    const { data: { user } } = await STATE.supabase.auth.getUser();
    if (!user) {
      window.location.href = 'index.html';
      return;
    }
    STATE.userId = user.id;
    
    // Get user profile
    const { data: profile } = await STATE.supabase
      .from('user_profiles')
      .select('*')
      .eq('user_id', user.id)
      .single();
    
    // Get business
    const { data: business } = await STATE.supabase
      .from('businesses')
      .select('*')
      .eq('id', STATE.businessId)
      .single();
    
    // Update UI
    document.getElementById('sb-avatar').textContent = (user.email || 'U').charAt(0).toUpperCase();
    document.getElementById('sb-user').textContent = user.email?.split('@')[0] || 'User';
    document.getElementById('sb-profession').textContent = STATE.profession.charAt(0).toUpperCase() + STATE.profession.slice(1);
    document.getElementById('sb-bizname').textContent = business?.name || 'Business';
    
    // Load profession module
    await loadModule(STATE.profession);
    
    hideLoading();
  } catch (err) {
    console.error('Init error:', err);
    showToast('Failed to initialize', 'error');
  }
}

// Start
initApp();
</script>
</body>
</html>
