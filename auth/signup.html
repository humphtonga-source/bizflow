<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign up for BizFlow - Free business management for Kenyan businesses">
    <title>Sign Up - BizFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23C9A84C'>B</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #12151c 0%, #1a1f2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 500px;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
        }

        .logo .biz {
            color: #C9A84C;
        }

        .logo .flow {
            color: #fff;
        }

        .signup-header h1 {
            color: #fff;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .signup-header p {
            color: #999;
            font-size: 1rem;
            font-weight: 400;
        }

        .signup-form {
            background: rgba(26, 31, 46, 0.8);
            border: 1px solid rgba(201, 168, 76, 0.2);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(18, 21, 28, 0.5);
            border: 1px solid rgba(201, 168, 76, 0.3);
            border-radius: 8px;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            autocomplete: off;
        }

        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: #666;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            background: rgba(18, 21, 28, 0.8);
            border-color: #C9A84C;
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #C9A84C 0%, #d4b85f 100%);
            color: #12151c;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            font-family: 'DM Sans', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(201, 168, 76, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .message {
            display: none;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.error {
            background: rgba(220, 38, 38, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(220, 38, 38, 0.3);
        }

        .message.success {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .message.info {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .signup-footer {
            text-align: center;
            margin-top: 2rem;
        }

        .signup-footer p {
            color: #666;
            font-size: 0.9rem;
        }

        .signup-footer a {
            color: #C9A84C;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signup-footer a:hover {
            color: #d4b85f;
        }

        .loading {
            display: none;
            text-align: center;
            color: #C9A84C;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(201, 168, 76, 0.3);
            border-top: 2px solid #C9A84C;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .signup-form {
                padding: 2rem;
            }

            .signup-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <main class="signup-container">
        <div class="signup-header">
            <div class="logo" aria-label="BizFlow">
                <span class="biz">Biz</span><span class="flow">Flow</span>
            </div>
            <h1>Start Free</h1>
            <p>14 days. No credit card needed.</p>
        </div>

        <form class="signup-form" id="signupForm" novalidate>
            <div id="signupMessage" class="message" role="alert" aria-live="polite"></div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="your@email.com"
                    autocomplete="email"
                    required
                    aria-required="true"
                >
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="At least 8 characters" 
                    autocomplete="new-password"
                    required
                    aria-required="true"
                >
            </div>

            <!-- Submit -->
            <button type="submit" class="submit-btn">Create Account</button>

            <div class="loading" id="loadingState" aria-hidden="true">
                <span class="spinner"></span>Setting up your account...
            </div>
        </form>

        <div class="signup-footer">
            <p>Already have an account? <a href="./signin.html">Sign in</a></p>
        </div>
    </main>

    <script src="../assets/js/supabase-client.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script>
        const form = document.getElementById('signupForm');
        const loadingState = document.getElementById('loadingState');
        const messageDiv = document.getElementById('signupMessage');
        let isSubmitting = false;

        form.addEventListener('submit', handleSignup);

        async function handleSignup(e) {
            e.preventDefault();
            if (isSubmitting) return;
            isSubmitting = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validation
            if (!email || !password) {
                showMessage('Please fill in all fields', 'error');
                isSubmitting = false;
                return;
            }

            if (password.length < 8) {
                showMessage('Password must be at least 8 characters', 'error');
                isSubmitting = false;
                return;
            }

            if (!validateEmail(email)) {
                showMessage('Please enter a valid email address', 'error');
                isSubmitting = false;
                return;
            }

            loadingState.style.display = 'block';
            showMessage('Creating your account...', 'info');

            try {
                console.log('[BizFlow Signup] Starting signup for:', email);
                
                // Step 1: Sign up in Supabase Auth
                const signupResult = await supabase.signUp(email, password);

                if (!signupResult.success) {
                    console.error('[BizFlow Signup] Auth signup failed:', signupResult.error);
                    showMessage('Signup failed: ' + (signupResult.error || 'Unknown error'), 'error');
                    loadingState.style.display = 'none';
                    isSubmitting = false;
                    return;
                }

                console.log('[BizFlow Signup] Auth signup successful, User ID:', signupResult.user.id);

                // Step 2: Create profile
                const profileData = {
                    id: signupResult.user.id,
                    email: email,
                    full_name: 'Customer',
                    role: 'business_owner',
                    plan_type: 'starter',
                    is_active: true,
                    signup_date: new Date().toISOString(),
                    created_at: new Date().toISOString(),
                    last_active: new Date().toISOString()
                };

                console.log('[BizFlow Signup] Inserting profile...');
                const profileInsert = await supabase.from('profiles')
                    .insert([profileData], { returning: 'minimal' });

                if (profileInsert.error) {
                    console.error('[BizFlow Signup] Profile insert failed:', profileInsert.error);
                    showMessage('Account created but profile setup failed: ' + profileInsert.error, 'error');
                    loadingState.style.display = 'none';
                    isSubmitting = false;
                    return;
                }

                console.log('[BizFlow Signup] Profile created successfully');

                supabase.setUser({
                    id: signupResult.user.id,
                    email: email,
                    role: 'business_owner'
                });

                showMessage('✓ Account created! Redirecting...', 'success');
                console.log('[BizFlow Signup] Signup complete - redirecting to business selector');

                // Redirect to business selector instead of dashboard
                setTimeout(() => {
                    window.location.href = '/bizflow/dashboard/select-business-type.html';
                }, 1500);

            } catch (error) {
                console.error('[BizFlow Signup] Exception:', error);
                showMessage('An error occurred: ' + error.message, 'error');
                loadingState.style.display = 'none';
                isSubmitting = false;
            }
        }

        function showMessage(message, type) {
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        window.addEventListener('load', () => {
            const h1 = document.querySelector('h1');
            if (h1) {
                h1.focus();
            }
        });
    </script>
</body>
</html>
