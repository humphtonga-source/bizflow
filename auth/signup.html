<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - BizFlow</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>BizFlow</h1>
                <h2>Create Your Account</h2>
                <p>Start managing your business today</p>
            </div>

            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="ownerName">Full Name</label>
                    <input type="text" id="ownerName" name="ownerName" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="businessName">Business Name</label>
                    <input type="text" id="businessName" name="businessName" placeholder="Your business name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+254 7XX XXX XXX" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
                    <small>Must contain at least 8 characters</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                </div>

                <div class="form-group checkbox">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="../pages/terms.html" target="_blank">Terms of Service</a> and <a href="../pages/privacy.html" target="_blank">Privacy Policy</a></label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Create Account</button>

                <div id="messageContainer" class="message"></div>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="signin.html">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="../assets/js/supabase-client.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth-handler.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', handleSignup);
    </script>
</body>
</html>
