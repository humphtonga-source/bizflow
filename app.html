<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BizFlow</title>
  <style>
    :root {
      --bg: #12151c;
      --bg2: #1a1f2e;
      --bg3: #222840;
      --border: #2a3050;
      --gold: #f0a500;
      --text: #e8eaf0;
      --txt3: #6b7499;
      --green: #22c55e;
      --red: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
  </style>
</head>
<body>

<!-- REDIRECT GUARD - MUST BE FIRST -->
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const prof = urlParams.get('prof');
  const bid = urlParams.get('bid');
  
  if (!prof || !bid) {
    window.location.href = '/bizflow/select-business.html';
  }
</script>

<div id="app-container" style="display:flex;height:100vh;flex-direction:column;overflow:hidden;"></div>

<script async defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap"></script>

<script>
  // Initialize Supabase
  const SUPABASE_URL = 'https://piaphpiowvgalvduacpt.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYXBocGlvd3ZnYWx2ZHVhY3B0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTg4MDUsImV4cCI6MjA5NjI3NDgwNX0.lEOrhLB0AaCzsDXWzXHkvth83-KtXKOpTYe8ndi3bFc';
  const { createClient } = window.supabase;
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  
  let STATE = {
    user: null,
    profession: null,
    businessId: null,
    userRole: 'owner',
    supabase: null
  };
  
  async function init() {
    try {
      // Get URL params
      const urlParams = new URLSearchParams(window.location.search);
      STATE.profession = urlParams.get('prof');
      STATE.businessId = urlParams.get('bid');
      
      // Check auth
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = '/bizflow/auth.html';
        return;
      }
      
      STATE.user = session.user;
      STATE.supabase = supabase;
      
      // Setup app shell
      setupAppShell();
      
      // Load module dynamically
      await loadModule(STATE.profession);
      
    } catch (err) {
      console.error('Init error:', err);
      alert('Error: ' + err.message);
    }
  }
  
  function setupAppShell() {
    const container = document.getElementById('app-container');
    container.innerHTML = `
      <div style="display:flex;flex-direction:column;height:100%;flex:1;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;">
          <div style="font-weight:700;font-size:18px;">Biz<span style="color:var(--gold);">Flow</span></div>
          <button onclick="window.location.href='/bizflow/select-business.html'" style="padding:8px 12px;background:var(--gold);color:#000;border:none;border-radius:4px;font-weight:700;cursor:pointer;font-size:12px;">All Businesses</button>
        </div>
        
        <div style="display:flex;flex:1;overflow:hidden;">
          <nav style="width:260px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;">
            <div id="nav-menu" style="padding:20px 0;"></div>
          </nav>
          
          <main style="flex:1;overflow-y:auto;">
            <div id="pane-dashboard"></div>
            <div id="pane-tables"></div>
            <div id="pane-orders"></div>
            <div id="pane-menu"></div>
            <div id="pane-appointments"></div>
            <div id="pane-staff"></div>
            <div id="pane-services"></div>
            <div id="pane-finance"></div>
            <div id="pane-clients"></div>
            <div id="pane-inventory"></div>
            <div id="pane-reports"></div>
            <div id="pane-settings"></div>
            <div id="pane-suppliers"></div>
          </main>
        </div>
      </div>
    `;
  }
  
  async function loadModule(profession) {
    try {
      const url = `/bizflow/modules/${profession}/index.js`;
      const response = await fetch(url);
      const code = await response.text();
      eval(code);
      await MODULE_INIT();
    } catch (err) {
      console.error('Module load error:', err);
      alert('Error loading module: ' + err.message);
    }
  }
  
  // Initialize on page load
  window.addEventListener('load', init);
</script>

</body>
</html>
