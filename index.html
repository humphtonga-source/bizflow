<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BizFlow - Multi-Tenant SaaS Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12151c;
      --bg2: #1a1f2e;
      --border: #2a3050;
      --gold: #f0a500;
      --text: #e8eaf0;
      --txt3: #6b7499;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, #1a1f2e 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 600px;
    }
    
    .logo {
      font-size: 64px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }
    
    .logo span { color: var(--gold); }
    
    h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    
    p {
      font-size: 16px;
      color: var(--txt3);
      margin-bottom: 40px;
      line-height: 1.6;
    }
    
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
      font-family: 'DM Sans', sans-serif;
    }
    
    .btn-primary {
      background: var(--gold);
      color: #000;
    }
    
    .btn-primary:hover {
      background: #e09500;
      transform: scale(1.05);
    }
    
    .btn-secondary {
      background: var(--bg2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    .btn-secondary:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    
    .features {
      margin-top: 60px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      text-align: left;
    }
    
    .feature {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    
    .feature-icon { font-size: 28px; margin-bottom: 8px; }
    
    .feature-name { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--txt3); }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">Biz <span>Flow</span></div>
  <h1>Multi-Tenant SaaS Platform</h1>
  <p>Manage your Salon, Restaurant, Bookshop, and more — all in one white-label platform.</p>
  
  <div class="btn-group">
    <a href="/bizflow/select-business.html" class="btn btn-primary">Get Started</a>
    <a href="/bizflow/auth.html" class="btn btn-secondary">Sign In</a>
  </div>
  
  <div class="features">
    <div class="feature">
      <div class="feature-icon">💅</div>
      <div class="feature-name">Salon</div>
    </div>
    <div class="feature">
      <div class="feature-icon">🍽️</div>
      <div class="feature-name">Restaurant</div>
    </div>
    <div class="feature">
      <div class="feature-icon">📚</div>
      <div class="feature-name">Bookshop</div>
    </div>
    <div class="feature">
      <div class="feature-icon">💊</div>
      <div class="feature-name">Chemist</div>
    </div>
    <div class="feature">
      <div class="feature-icon">⚖️</div>
      <div class="feature-name">Law Firm</div>
    </div>
    <div class="feature">
      <div class="feature-icon">🎰</div>
      <div class="feature-name">Betting</div>
    </div>
  </div>
</div>

</body>
</html>
